name: Weekly Review Scrape

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday 9am UTC
  workflow_dispatch:        # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Scrape Klaviyo review counts
        env:
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
        run: python scrape_kl_reviews.py

      - name: Sync review counts to landing pages
        env:
          WC_KEY: ${{ secrets.WC_KEY }}
          WC_SECRET: ${{ secrets.WC_SECRET }}
        run: python sync_reviews.py

      - name: Commit and push
        run: |
          git config user.name  "review-scrape[bot]"
          git config user.email "review-scrape@grizzlyherb.co"
          git add pages/ kl-review-counts.json
          if git diff --staged --quiet; then
            echo "No review changes — skipping commit"
            echo "CHANGED=false" >> $GITHUB_ENV
          else
            git commit -m "chore: weekly review sync $(date -u +'%Y-%m-%d')"
            git push
            echo "CHANGED=true" >> $GITHUB_ENV
          fi

      # This project's Vercel git integration does not work: deploy hooks return
      # a PENDING job that never becomes a deployment, and every deployment in
      # the project's history is source: cli. The old step here posted to that
      # hook and always exited 0, so stock changes were committed and silently
      # never went live. Deploy with the CLI instead, the one method proven to
      # work on this project.
      #
      # .vercel/ is gitignored, so CI has no project link. VERCEL_ORG_ID and
      # VERCEL_PROJECT_ID supply it; without them `vercel deploy --yes` would
      # create a NEW project rather than deploying this one. They are
      # identifiers, not credentials, and do nothing without VERCEL_TOKEN.
      # Team: team-1772s-projects.
      - name: Deploy to Vercel
        if: env.CHANGED == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Tq4rwZCJKe4gK00awvIt8arp
          VERCEL_PROJECT_ID: prj_0xuouwvx9khO4He4TNb2Uk2dOM2r
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set. Changes were committed but the live site was NOT updated."
            exit 1
          fi
          npm install --global vercel@latest
          vercel deploy --prod --yes --token "$VERCEL_TOKEN"
          echo "Deployed to production."
